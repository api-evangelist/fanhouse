name: Fanhouse
description: >-
  Fanhouse was a creator-subscription social platform, backed by a16z, that let
  fans pay creators directly for exclusive posts, photos, and community access
  rather than through ad-driven feeds. It was surfaced as an a16z portfolio
  company and added to the API Evangelist network as a stub for enrichment. The
  original product operated at fanhouse.app, which no longer resolves to the
  company (it now redirects to an unrelated domain), indicating the a16z-backed
  platform is defunct. No public developer portal, API documentation, OpenAPI
  definition, or other machine-readable API surface could be located for the
  original Fanhouse product, so no scored API artifacts could be produced without
  fabrication. This profile is retained as a company/lead record.
